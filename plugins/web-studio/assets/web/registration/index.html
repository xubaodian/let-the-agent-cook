<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Workshop registration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <main>
    <h1>Field Workshop</h1>
    <p id="rules">Loading registration rules…</p>
    <form id="registration" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Reserve a seat</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <details>
      <summary>What happens after I register?</summary>
      <p id="faq">Loading registration details…</p>
    </details>
  </main>
  <script>
    const form = document.querySelector("#registration");
    const email = document.querySelector("#email");
    const statusMessage = document.querySelector("#status");
    const button = form.querySelector("button");

    async function loadCopy() {
      try {
        const response = await fetch("event.json");
        if (!response.ok) throw new Error("Missing event information");
        const copy = await response.json();
        document.querySelector("#rules").textContent = copy.rules;
        document.querySelector("#faq").textContent = copy.faq;
      } catch {
        document.querySelector("#rules").textContent = "Registration rules are unavailable.";
        document.querySelector("#faq").textContent = "Registration details are unavailable.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!email.value.trim()) {
        statusMessage.textContent = "Enter your email.";
        email.focus();
        return;
      }
      if (!email.validity.valid) {
        statusMessage.textContent = "Enter a valid email.";
        email.focus();
        return;
      }
      button.disabled = true;
      statusMessage.textContent = "Reserving your seat…";
      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email: email.value.trim()}),
        });
        const result = await response.json();
        statusMessage.textContent = result.message;
        if (result.registered) form.reset();
      } catch {
        statusMessage.textContent = "Registration could not be completed. Try again.";
      } finally {
        button.disabled = false;
      }
    });

    loadCopy();
  </script>
</body>
</html>
