name: Release Agent Cook

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match the package version to the tag
        id: metadata
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("agent/pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-cook-sandbox:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
  installers:
    needs: version
    uses: ./.github/workflows/installers.yml
    with:
      signed: true
    secrets: inherit
  image:
    needs: [version, installers]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.version.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
  publish:
    needs: [version, image]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm both architectures can be pulled without credentials
        env:
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          docker manifest inspect "$IMAGE" | jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")'
      - uses: actions/download-artifact@v8
        with:
          pattern: AgentCook-*
          path: installers
          merge-multiple: true
      - name: Publish the versioned installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            installers/AgentCook-windows-x64.msi installers/AgentCook-macos-arm64.pkg installers/AgentCook-ubuntu-amd64.deb
