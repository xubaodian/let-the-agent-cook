name: Verify public case inputs
on:
  push:
    branches: [verify/replay-import]
    paths: ['.github/workflows/verify-public-inputs.yml']
permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark verification
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=preflight/case-inputs \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retrieve the public Internet-use data
        run: |
          python3 - <<'PY'
          import base64
          import csv
          import gzip
          import io
          import json
          import sys
          from urllib.request import Request, urlopen

          codes = {'IDN', 'MYS', 'PHL', 'SGP', 'THA', 'VNM'}
          wb_url = 'https://api.worldbank.org/v2/country/IDN;MYS;PHL;SGP;THA;VNM/indicator/IT.NET.USER.ZS?date=2015:2024&format=json&per_page=100'
          owid_url = 'https://ourworldindata.org/grapher/share-of-individuals-using-the-internet.csv'

          def get(url):
              return urlopen(Request(url, headers={'User-Agent': 'AgentCookCaseSource/1.0'}), timeout=20).read()

          try:
              response = json.loads(get(wb_url))
              assert len(response) == 2 and len(response[1]) == 60
              data = {'source': 'wdi', 'url': wb_url, 'response': response}
          except Exception as error:
              print(f'World Bank API response unavailable ({type(error).__name__}), use OWID published ITU series.')
              text = get(owid_url).decode('utf-8-sig')
              data = {'source': 'owid', 'url': owid_url, 'rows': [
                  row for row in csv.DictReader(io.StringIO(text))
                  if row['Code'] in codes and 2015 <= int(row['Year']) <= 2024
              ]}
              assert set(row['Code'] for row in data['rows']) == codes and len(data['rows']) >= 45
          content = base64.b64encode(gzip.compress(json.dumps(data, ensure_ascii=False).encode())).decode()
          for i in range(0, len(content), 880):
              print('PUBLIC_CASE_DATA ' + content[i:i+880])
          PY
      - name: Report verification
        if: always()
        env:
          OK: ${{ job.status == 'success' }}
        run: |
          state=failure
          if [[ "$OK" == true ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=preflight/case-inputs \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
