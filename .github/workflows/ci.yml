name: Agent Cook CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install development dependencies
        run: |
          if test -f agent/uv.lock; then
            uv sync --project agent --locked --all-extras
          else
            uv sync --project agent --all-extras
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: agent-uv-lock
          path: agent/uv.lock
          retention-days: 3
      - name: Test the CLI, service and runtime
        run: uv run --project agent --locked --all-extras python -m unittest discover -s agent/tests -v
      - name: Verify the installed CLI
        run: |
          uv build --wheel --out-dir "${RUNNER_TEMP}/agent-wheel" agent
          uv tool install --python 3.12 "${RUNNER_TEMP}"/agent-wheel/*.whl
          cd "${RUNNER_TEMP}"
          "$(uv tool dir --bin)/agent-cook" --list-models

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the workspace from a clean checkout
        run: docker build -f sandbox/Dockerfile -t agent-cook-sandbox:local .
      - name: Exercise packaged runtimes, files and Chromium
        run: docker run --rm -i --network none --shm-size=128m agent-cook-sandbox:local python - < sandbox/smoke.py
      - name: Build the service image
        run: docker build -f agent/Dockerfile.server -t agent-cook-server:local agent
      - name: Verify the packaged service entry point
        run: docker run --rm agent-cook-server:local --help
