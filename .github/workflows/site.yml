name: Personal site

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main, 'verify/**']
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: personal-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.publishing.outputs.enabled }}
    defaults:
      run:
        working-directory: site
    env:
      SITE_BASE: /let-the-agent-cook/
      SITE_URL: https://xubaodian.github.io
      PUBLIC_REPO_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether GitHub Pages is ready
        if: github.ref == 'refs/heads/main'
        id: publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          has_pages="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)"
          if [[ "$has_pages" == true ]]; then
            build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
            if [[ "$build_type" == workflow ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::notice::Select GitHub Actions under Settings > Pages > Source to enable deployment."
      - uses: actions/configure-pages@v5
        if: steps.publishing.outputs.enabled == 'true'
        id: pages
      - name: Use the configured Pages origin and base path
        if: steps.publishing.outputs.enabled == 'true'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          printf 'SITE_URL=%s\nSITE_BASE=%s\n' "$PAGES_ORIGIN" "${PAGES_BASE:-/}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run test:content
      - run: npm run check
      - run: npm run build
      - name: Verify that article and case source links exist
        run: python scripts/check-source-links.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: personal-site-preview
          path: site/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: personal-site-browser-failures
          path: site/test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: steps.publishing.outputs.enabled == 'true'
        with:
          path: site/dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  preflight-status:
    if: always() && github.ref == 'refs/heads/verify/replay-import'
    needs: build
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASSED: ${{ needs.build.result == 'success' }}
    steps:
      - run: |
          state=failure
          if [[ "$PASSED" == true ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=preflight/replay-import \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
