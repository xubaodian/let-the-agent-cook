name: Personal site

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main, 'verify/**']
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this main build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_BASE: /let-the-agent-cook/
      SITE_URL: https://xubaodian.github.io
      PUBLIC_REPO_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify that article and case source links exist
        run: python scripts/check-source-links.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: personal-site-preview
          path: site/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: personal-site-browser-failures
          path: site/test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  preflight-status:
    if: always() && startsWith(github.ref, 'refs/heads/verify/')
    needs: [build]
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASSED: ${{ needs.build.result == 'success' }}
    steps:
      - run: |
          state=failure
          if [[ "$PASSED" == true ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --method POST \
            -f state="$state" -f context=preflight/site \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
