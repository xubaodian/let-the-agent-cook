[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cook"
version = "0.1.0"
description = "The Python runtime for Let the Agent Cook"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "keyring>=25.6,<26",
    "mcp>=1.29,<2",
    "openai>=1.66,<3",
    "prompt-toolkit>=3.0.50,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
e2b = ["e2b>=2.56,<3"]
mcp = []
server = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
examples = ["openpyxl==3.1.5", "python-pptx==1.0.2", "playwright==1.62.0"]
release = ["pyinstaller>=6.12,<7"]

[project.scripts]
agent-cook = "agent_cook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_cook.context" = ["execution_prompt.md"]
"agent_cook" = ["data/**/*"]
