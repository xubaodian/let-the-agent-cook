[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cook"
version = "0.1.0"
description = "The Python runtime for Let the Agent Cook"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "openai>=1.66,<3",
]

[project.optional-dependencies]
e2b = ["e2b>=2.56,<3"]

[project.scripts]
agent-cook = "agent_cook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
